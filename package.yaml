name:                syncbox
synopsis: File synchronization tool written in Haskell
version:             0.1.0.1
github:              "damianfral/syncbox"
license:             BSD3
author:              "damianfral"
maintainer:          "huevofritopamojarpan@gmail.com"
copyright:           "2019 damianfral"

extra-source-files:
- README.md
- ChangeLog.md
- assets/style.css
- migrations/*.sql

# Metadata used when publishing your package
# synopsis:            Short description of your package
# category:            Web

# To avoid duplicated efforts in documentation and dealing with the
# complications of embedding Haddock markup inside cabal files, it is
# common to point users to the README.md file.
description: File synchronization tool written in Haskell

dependencies:
  - base
  - blake3
  - blaze-html
  - bytestring
  - conduit
  - conduit-extra
  - co-log
  - co-log-core
  - directory
  - dir-traverse
  - file-embed
  - filepath
  - formatting
  - fsnotify
  - generic-lens
  - http-types
  - lens
  - mime-types
  - neat-interpolation
  - optparse-generic
  - protolude
  - servant
  - servant-blaze
  - servant-conduit
  - servant-server
  - sqlite-simple
  - tar
  - text
  - typed-process
  - wai
  - wai-extra
  - warp
  - zlib

library:
  source-dirs: ./src/

executables:
  syncbox:
    main         : Main.hs
    source-dirs  : ./src
    dependencies :
      - syncbox
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N

tests:
  spec:
    main: Spec.hs
    source-dirs: test
    build-tools: sydtest-discover
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - syncbox
    - sydtest
    - sydtest-discover
    - servant
    - text

ghc-options:
  - -O2
  - -fshow-warning-groups
  - -Weverything
  - -Wno-missing-deriving-strategies
  - -Wno-missing-export-lists
  - -Wno-missing-import-lists
  - -Wno-missing-kind-signatures
  - -Wno-missing-local-signatures
  - -Wno-missing-role-annotations
  - -Wno-missing-safe-haskell-mode
  - -Wno-monomorphism-restriction
  - -Wno-safe
  - -Wno-unsafe
  - -fwrite-ide-info
  - -funbox-strict-fields
  - -flate-dmd-anal
  - -fno-omit-interface-pragmas
  - -fregs-graph
  - -fspec-constr-recursive=32
  - -fmax-worker-args=32
  - -fexpose-all-unfoldings
  - -fspecialise-aggressively
  - -Wno-unused-packages # sydtest-discover gets marked as unused
